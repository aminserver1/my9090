
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kuchat - Global Chat</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            user-select: none;
        }
        
        input, textarea { user-select: auto; }

        body { 
            background-color: #020617; 
            color: #f8fafc; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            height: 100dvh; 
        }

        #root { height: 100%; }
        
        .glass { 
            background: rgba(15, 23, 42, 0.7); 
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }

        .premium-border { 
            border: 2px solid transparent; 
            background: linear-gradient(#0f172a, #0f172a) padding-box, 
                        linear-gradient(45deg, #3b82f6, #a855f7) border-box; 
        }
        
        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        .animate-shimmer {
            background: linear-gradient(90deg, #3b82f6, #a855f7, #3b82f6);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
        }

        .chat-scroll::-webkit-scrollbar { width: 3px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        .safe-bottom { padding-bottom: calc(1rem + env(safe-area-inset-bottom)); }
        .safe-top { padding-top: env(safe-area-inset-top); }

        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        button { transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s; }
        button:active { transform: scale(0.94); opacity: 0.8; }
        
        /* Fixed delete icon visibility for mobile */
        .delete-btn {
            opacity: 0.6;
            transition: opacity 0.2s, transform 0.1s;
        }
        @media (hover: hover) {
            .delete-btn { opacity: 0; }
            .group:hover .delete-btn { opacity: 1; }
        }
        .delete-btn:active { opacity: 1; color: #ef4444; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = window.React;

        const firebaseConfig = {
            apiKey: "AIzaSyDirc0CpBTWr5gxtZQv4ASZv8VRPP2QT90",
            authDomain: "kurdtoolserver.firebaseapp.com",
            databaseURL: "https://kurdtoolserver-default-rtdb.firebaseio.com",
            projectId: "kurdtoolserver",
            storageBucket: "kurdtoolserver.appspot.com",
            appId: "1:215346001086:android:8bb74d10253a878b9ddaef"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.database();

        const ADMIN_EMAIL = 'kuchat60111@gmail.com';
        const PREMIUM_COST = 10000;
        const ROOM_COST = 1000;
        const TELEGRAM = 'https://t.me/Anatoly_Programmer601';

        const App = () => {
            const [view, setView] = useState('splash');
            const [user, setUser] = useState(null);
            const [tab, setTab] = useState('home');
            const [activeRoom, setActiveRoom] = useState(null);
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                const unsub = auth.onAuthStateChanged(async (u) => {
                    if (u) {
                        const userRef = db.ref(`users/${u.uid}`);
                        userRef.on('value', (snap) => {
                            const data = snap.val();
                            if (data) setUser({ ...data, uid: u.uid });
                        });
                        setView('main');
                    } else {
                        setTimeout(() => setView('auth'), 2000);
                    }
                });
                return () => unsub();
            }, []);

            const handleAuth = async (email, name, pass, isReg) => {
                setLoading(true);
                try {
                    const cleanEmail = email.trim().toLowerCase();
                    if (isReg) {
                        const res = await auth.createUserWithEmailAndPassword(cleanEmail, pass);
                        const isAdmin = cleanEmail === ADMIN_EMAIL;
                        const userData = {
                            displayName: name,
                            email: cleanEmail,
                            coins: isAdmin ? 999999 : 50,
                            isPremium: isAdmin,
                            isAdmin: isAdmin,
                            photoURL: `https://api.dicebear.com/7.x/avataaars/svg?seed=${name}`,
                            lastBonus: 0,
                            lastActive: Date.now()
                        };
                        await db.ref(`users/${res.user.uid}`).set(userData);
                    } else {
                        await auth.signInWithEmailAndPassword(cleanEmail, pass);
                    }
                } catch (err) {
                    alert(err.message);
                } finally {
                    setLoading(false);
                }
            };

            if (view === 'splash') return (
                <div className="h-screen w-full flex flex-col items-center justify-center bg-slate-950">
                    <div className="w-24 h-24 rounded-[2rem] bg-blue-600 flex items-center justify-center shadow-2xl mb-6 animate-pulse">
                        <i className="fas fa-comments text-5xl text-white"></i>
                    </div>
                    <h1 className="text-5xl font-extrabold animate-shimmer">KUCHAT</h1>
                </div>
            );

            if (view === 'auth') return <AuthScreen onAuth={handleAuth} loading={loading} />;

            return (
                <div className="h-full max-w-md mx-auto bg-slate-950 flex flex-col relative border-x border-slate-900 shadow-2xl overflow-hidden">
                    <header className="h-20 glass flex items-center justify-between px-6 z-20 border-b border-white/5 shrink-0 safe-top">
                        <h1 className="text-xl font-bold animate-shimmer">KUCHAT</h1>
                        <div className="flex items-center gap-3">
                            {user?.isAdmin && <button onClick={() => setTab('admin')} className="w-9 h-9 rounded-full bg-red-500/10 text-red-500 flex items-center justify-center"><i className="fas fa-shield-halved text-xs"></i></button>}
                            <div className="bg-slate-900/80 px-3 py-1.5 rounded-full flex items-center gap-2 border border-white/10">
                                <i className="fas fa-coins text-yellow-500 text-xs"></i>
                                <span className="text-xs font-bold">{user?.coins?.toLocaleString()}</span>
                            </div>
                        </div>
                    </header>
                    
                    <main className="flex-1 overflow-y-auto pb-24">
                        {tab === 'home' && <HomeView user={user} setView={setView} setActiveRoom={setActiveRoom} />}
                        {tab === 'notif' && <NotifView isAdmin={user?.isAdmin} />}
                        {tab === 'store' && <StoreView user={user} />}
                        {tab === 'profile' && <ProfileView user={user} />}
                        {tab === 'admin' && user?.isAdmin && <AdminView setTab={setTab} />}
                    </main>

                    <nav className="h-20 glass absolute bottom-0 left-0 right-0 flex items-center justify-around z-20 border-t border-white/5 safe-bottom">
                        {[
                            { id: 'home', icon: 'fa-house-user', label: 'Rooms' },
                            { id: 'notif', icon: 'fa-bell', label: 'Alerts' },
                            { id: 'store', icon: 'fa-gem', label: 'Shop' },
                            { id: 'profile', icon: 'fa-circle-user', label: 'Me' }
                        ].map(item => (
                            <button key={item.id} onClick={() => setTab(item.id)} className={`flex flex-col items-center gap-1 ${tab === item.id ? 'text-blue-400' : 'text-slate-500'}`}>
                                <i className={`fas ${item.icon} text-lg`}></i>
                                <span className="text-[10px] font-bold uppercase tracking-wider">{item.label}</span>
                            </button>
                        ))}
                    </nav>
                    
                    {view === 'chat' && activeRoom && <ChatView room={activeRoom} user={user} onBack={() => setView('main')} />}
                    {view === 'create' && <CreateRoomView user={user} setView={setView} />}
                </div>
            );
        };

        const AuthScreen = ({ onAuth, loading }) => {
            const [reg, setReg] = useState(false);
            const [e, setE] = useState('');
            const [n, setN] = useState('');
            const [p, setP] = useState('');
            return (
                <div className="h-screen max-w-md mx-auto bg-slate-950 p-10 flex flex-col justify-center">
                    <div className="mb-12 text-center">
                        <h1 className="text-5xl font-extrabold animate-shimmer mb-4">KUCHAT</h1>
                        <p className="text-slate-500 text-sm italic">{reg ? 'Register new account' : 'Sign in to your account'}</p>
                    </div>
                    <div className="space-y-4">
                        {reg && <input className="w-full h-14 bg-slate-900 rounded-2xl px-6 outline-none text-white border border-white/5 focus:border-blue-500/50" placeholder="Full Name" onChange={x=>setN(x.target.value)} />}
                        <input className="w-full h-14 bg-slate-900 rounded-2xl px-6 outline-none text-white border border-white/5 focus:border-blue-500/50" placeholder="Email Address" onChange={x=>setE(x.target.value)} />
                        <input type="password" dir="ltr" className="w-full h-14 bg-slate-900 rounded-2xl px-6 outline-none text-white border border-white/5 focus:border-blue-500/50" placeholder="Password" onChange={x=>setP(x.target.value)} />
                        <button disabled={loading} onClick={() => onAuth(e, n, p, reg)} className="w-full h-14 bg-blue-600 rounded-2xl font-bold text-white shadow-lg flex items-center justify-center active:scale-95 transition-all">
                            {loading ? <div className="loader"></div> : (reg ? 'Join Kuchat' : 'Login Now')}
                        </button>
                        <button onClick={() => setReg(!reg)} className="w-full text-slate-500 text-xs font-semibold">{reg ? 'Already have an account? Login' : 'Need an account? Sign Up'}</button>
                    </div>
                </div>
            );
        };

        const HomeView = ({ user, setView, setActiveRoom }) => {
            const [rooms, setRooms] = useState([]);
            const [countdown, setCountdown] = useState("");
            const [canClaim, setCanClaim] = useState(false);

            useEffect(() => {
                const ref = db.ref('rooms');
                ref.on('value', (snap) => {
                    const data = snap.val();
                    const list = data ? Object.entries(data).map(([id, val]) => ({ id, ...val })) : [];
                    setRooms(list.sort((a,b) => (b.isOfficial?1:0) - (a.isOfficial?1:0)));
                });
                return () => ref.off();
            }, []);

            useEffect(() => {
                const updateTimer = () => {
                    if (!user) return;
                    const now = Date.now();
                    const last = user.lastBonus || 0;
                    const waitTime = 24 * 60 * 60 * 1000;
                    const diff = now - last;

                    if (diff >= waitTime || user.isAdmin) {
                        setCanClaim(true);
                        setCountdown("");
                    } else {
                        setCanClaim(false);
                        const remaining = waitTime - diff;
                        const hours = Math.floor(remaining / (1000 * 60 * 60));
                        const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
                        const seconds = Math.floor((remaining % (1000 * 60)) / 1000);
                        setCountdown(`${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`);
                    }
                };
                updateTimer();
                const interval = setInterval(updateTimer, 1000);
                return () => clearInterval(interval);
            }, [user]);

            const handleClaim = async () => {
                if (!canClaim && !user.isAdmin) return;
                try {
                    await db.ref(`users/${user.uid}`).update({
                        coins: (user.coins || 0) + 1,
                        lastBonus: Date.now()
                    });
                    alert('بەسەرکەوتوویی ١ کۆینت وەرگرت!');
                } catch (e) {
                    alert('هەڵەیەک ڕوویدا لە وەرگرتنی خەڵات');
                }
            };

            const deleteRoom = (e, roomId) => {
                e.stopPropagation();
                if(confirm('دڵنیای لە سڕینەوەی ئەم ڕوومە؟')) {
                    db.ref(`rooms/${roomId}`).remove();
                }
            };

            return (
                <div className="p-6 space-y-6">
                    <div className="glass p-5 rounded-3xl flex items-center justify-between border-blue-500/20">
                        <div className="flex items-center gap-4">
                            <div className={`w-11 h-11 rounded-full ${canClaim ? 'bg-blue-500/10 text-blue-500 animate-pulse' : 'bg-slate-800 text-slate-500'} flex items-center justify-center`}>
                                <i className="fas fa-gift text-lg"></i>
                            </div>
                            <div>
                                <h4 className="text-sm font-bold">خەڵاتی ڕۆژانە</h4>
                                <p className="text-[10px] text-slate-500 font-mono">
                                    {canClaim ? 'ئامادەیە بۆ وەرگرتن' : `${countdown} ماوە`}
                                </p>
                            </div>
                        </div>
                        <button 
                            disabled={!canClaim && !user?.isAdmin}
                            onClick={handleClaim} 
                            className={`px-5 py-2.5 rounded-xl text-xs font-bold shadow-lg transition-all ${canClaim || user?.isAdmin ? 'bg-blue-600 text-white shadow-blue-500/20 active:scale-95' : 'bg-slate-800 text-slate-500 cursor-not-allowed opacity-50'}`}
                        >
                            {canClaim || user?.isAdmin ? 'وەرگرتن' : 'چاوەڕوانبە'}
                        </button>
                    </div>
                    <div className="flex justify-between items-center">
                        <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest">ڕوومە گشتییەکان</h3>
                        <button onClick={() => setView('create')} className="bg-slate-900 border border-white/5 px-4 py-2 rounded-xl text-[10px] font-bold active:scale-95">دروستکردنی ڕووم</button>
                    </div>
                    <div className="grid gap-3">
                        {rooms.map(room => (
                            <div key={room.id} className={`glass p-3 rounded-2xl flex items-center gap-4 group relative ${room.isOfficial ? 'premium-border' : ''}`}>
                                <div onClick={() => { 
                                    if(room.isOfficial && !user?.isAdmin) return alert('تەنها ئەدمین بۆی هەیە بچێتە ژوورەوە');
                                    setActiveRoom(room); setView('chat'); 
                                }} className="flex-1 flex items-center gap-4 cursor-pointer overflow-hidden">
                                    <img src={room.photoURL || 'https://picsum.photos/seed/'+room.id+'/200'} className="w-12 h-12 rounded-xl object-cover shrink-0 shadow-lg" />
                                    <div className="flex-1 min-w-0">
                                        <h4 className="font-bold text-sm truncate">{room.name} {room.isOfficial && <i className="fas fa-certificate text-blue-400 text-[10px]"></i>}</h4>
                                        <p className="text-[10px] text-slate-500 truncate">{room.description}</p>
                                    </div>
                                </div>
                                {user?.isAdmin && !room.isOfficial && (
                                    <button 
                                        onClick={(e) => deleteRoom(e, room.id)} 
                                        className="delete-btn w-9 h-9 rounded-xl bg-red-500/10 text-red-500 flex items-center justify-center shrink-0 z-30"
                                    >
                                        <i className="fas fa-trash-alt text-xs"></i>
                                    </button>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const ChatView = ({ room, user, onBack }) => {
            const [msgs, setMsgs] = useState([]);
            const [input, setInput] = useState('');
            const scroll = useRef();

            useEffect(() => {
                const ref = db.ref(`messages/${room.id}`).limitToLast(100);
                ref.on('value', (snap) => {
                    const data = snap.val();
                    setMsgs(data ? Object.entries(data).map(([id, val]) => ({ id, ...val })) : []);
                });
                return () => ref.off();
            }, [room.id]);

            useEffect(() => { if (scroll.current) scroll.current.scrollTop = scroll.current.scrollHeight; }, [msgs]);

            const send = () => {
                if (!input.trim()) return;
                db.ref(`messages/${room.id}`).push({
                    senderId: user?.uid,
                    senderName: user?.displayName,
                    senderPhoto: user?.photoURL,
                    content: input,
                    isPremium: user?.isPremium,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                setInput('');
            };

            const deleteMsg = (msgId) => {
                if(confirm('دڵنیای لە سڕینەوەی ئەم نامەیە؟')) {
                    db.ref(`messages/${room.id}/${msgId}`).remove();
                }
            };

            return (
                <div className="fixed inset-0 bg-slate-950 z-[100] flex flex-col h-full overflow-hidden">
                    <header className="h-16 glass flex items-center justify-between px-4 shrink-0 border-b border-white/5 pt-[env(safe-area-inset-top)]">
                        <div className="flex items-center gap-3">
                            <button onClick={onBack} className="w-10 h-10 rounded-full bg-slate-900 flex items-center justify-center"><i className="fas fa-arrow-left"></i></button>
                            <img src={room.photoURL || 'https://picsum.photos/seed/'+room.id+'/200'} className="w-10 h-10 rounded-xl object-cover" />
                            <h4 className="font-bold text-sm truncate max-w-[150px]">{room.name}</h4>
                        </div>
                    </header>
                    <div ref={scroll} className="flex-1 overflow-y-auto p-5 space-y-4 chat-scroll">
                        {msgs.map(m => (
                            <div key={m.id} className={`flex gap-3 group relative ${m.senderId === user?.uid ? 'flex-row-reverse' : ''}`}>
                                <div className={`max-w-[80%] flex flex-col ${m.senderId === user?.uid ? 'items-end' : 'items-start'}`}>
                                    <div className="flex items-center gap-1 mb-1">
                                        <span className="text-[9px] font-bold text-slate-500">{m.senderName}</span>
                                        {m.isPremium && <i className="fas fa-circle-check text-blue-400 text-[8px]"></i>}
                                    </div>
                                    <div className="flex items-center gap-2">
                                        {user?.isAdmin && (
                                            <button 
                                                onClick={() => deleteMsg(m.id)} 
                                                className="delete-btn w-6 h-6 rounded bg-red-500/10 text-red-500 flex items-center justify-center shrink-0 z-30"
                                            >
                                                <i className="fas fa-trash text-[8px]"></i>
                                            </button>
                                        )}
                                        <div className={`p-3 rounded-2xl text-sm ${m.senderId === user?.uid ? 'bg-blue-600 text-white rounded-tr-none shadow-blue-500/10' : 'bg-slate-900 text-slate-200 rounded-tl-none border border-white/5'}`}>
                                            {m.content}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                    <div className="p-4 glass flex items-center gap-3 safe-bottom border-t border-white/5">
                        <input className="flex-1 h-12 bg-slate-900 rounded-2xl px-5 outline-none text-white text-sm" placeholder="نامە بنوسە..." value={input} onChange={x=>setInput(x.target.value)} onKeyDown={x=>x.key==='Enter'&&send()} />
                        <button onClick={send} className="w-12 h-12 rounded-2xl bg-blue-600 flex items-center justify-center shadow-lg active:scale-90 transition-all"><i className="fas fa-paper-plane text-white transform -rotate-45"></i></button>
                    </div>
                </div>
            );
        };

        const StoreView = ({ user }) => (
            <div className="p-6 space-y-6">
                <div className="glass p-6 rounded-[2.5rem] premium-border text-center shadow-2xl">
                    <i className="fas fa-crown text-4xl text-blue-400 mb-4 block animate-bounce"></i>
                    <h3 className="text-xl font-bold">ئەندامی پریمیم</h3>
                    <p className="text-[10px] text-slate-500 mt-2 mb-6">Verified Badge + Global Status + 1,000 Coin Gift</p>
                    <button onClick={async () => {
                        if (user?.isPremium) return alert('پێشتر چالاک کراوە');
                        if ((user?.coins || 0) < PREMIUM_COST) return alert('کۆینت کەمە بۆ ئەم خزمەتگوزارییە');
                        await db.ref(`users/${user.uid}`).update({ coins: user.coins - PREMIUM_COST + 1000, isPremium: true });
                        alert('پریمیم چالاککرا بە سەرکەوتوویی!');
                    }} className="w-full h-14 bg-blue-600 rounded-2xl font-bold uppercase tracking-widest active:scale-95 transition-all">{user?.isPremium ? 'ACTIVE' : PREMIUM_COST + ' COINS'}</button>
                </div>
                <div className="grid grid-cols-2 gap-4">
                    {[1000, 5000, 10000, 50000].map(c => (
                        <button key={c} onClick={() => window.open(TELEGRAM)} className="glass p-5 rounded-3xl flex flex-col items-center gap-2 active:scale-95 transition-all border border-white/5">
                            <i className="fas fa-coins text-yellow-500"></i>
                            <span className="font-bold text-sm">{c.toLocaleString()}</span>
                            <span className="text-[9px] text-blue-500 font-bold uppercase">IQD {c.toLocaleString()}</span>
                        </button>
                    ))}
                </div>
            </div>
        );

        const NotifView = ({ isAdmin }) => {
            const [notifs, setNotifs] = useState([]);
            useEffect(() => {
                const ref = db.ref('notifications');
                ref.on('value', (snap) => {
                    const data = snap.val();
                    const list = data ? Object.entries(data).map(([id, val]) => ({ id, ...val })) : [];
                    setNotifs(list.reverse());
                });
                return () => ref.off();
            }, []);

            const deleteNotif = (id) => {
                if(confirm('دڵنیای لە سڕینەوەی ئەم ئاگادارییە؟')) {
                    db.ref(`notifications/${id}`).remove();
                }
            };

            return (
                <div className="p-6 space-y-6">
                    <h3 className="text-xl font-extrabold uppercase tracking-tight">System Alerts</h3>
                    {notifs.length === 0 ? <div className="text-center py-20 text-slate-700 font-bold text-xs uppercase tracking-widest">هیچ ئاگادارییەک نییە</div> : 
                    notifs.map(n => (
                        <div key={n.id} className="glass p-5 rounded-3xl border-l-4 border-blue-500 group flex justify-between items-start relative">
                            <div className="flex-1 min-w-0 pr-8">
                                <h4 className="font-bold text-sm text-blue-400 mb-1">{n.title}</h4>
                                <p className="text-xs text-slate-400 leading-relaxed">{n.message}</p>
                            </div>
                            {isAdmin && (
                                <button 
                                    onClick={() => deleteNotif(n.id)} 
                                    className="delete-btn w-8 h-8 rounded-lg bg-red-500/10 text-red-500 flex items-center justify-center shrink-0 absolute top-4 right-4 z-30"
                                >
                                    <i className="fas fa-trash-alt text-[10px]"></i>
                                </button>
                            )}
                        </div>
                    ))}
                </div>
            );
        };

        const ProfileView = ({ user }) => {
            const [name, setName] = useState(user?.displayName || '');
            return (
                <div className="p-10 flex flex-col items-center gap-8">
                    <div className="relative">
                        <img src={user?.photoURL} className="w-28 h-28 rounded-[2.5rem] border-4 border-slate-900 shadow-2xl" />
                        {user?.isPremium && <i className="fas fa-circle-check absolute -bottom-1 -right-1 text-2xl text-blue-400 bg-slate-950 rounded-full"></i>}
                    </div>
                    <div className="w-full space-y-4">
                        <div className="bg-slate-900 rounded-2xl p-6 border border-white/5 shadow-inner text-right">
                            <label className="text-[10px] text-slate-500 font-bold uppercase block mb-2">Display Name</label>
                            <input className="w-full bg-transparent outline-none text-white font-bold" value={name} onChange={x=>setName(x.target.value)} />
                        </div>
                        <button onClick={async () => {
                            await db.ref(`users/${user.uid}`).update({ displayName: name, photoURL: `https://api.dicebear.com/7.x/avataaars/svg?seed=${name}` });
                            alert('پڕۆفایل نوێکرایەوە');
                        }} className="w-full h-14 bg-blue-600 rounded-2xl font-bold shadow-lg shadow-blue-900/10 active:scale-95 transition-all">Update Profile</button>
                        <button onClick={() => { auth.signOut(); location.reload(); }} className="w-full h-14 bg-red-500/10 text-red-500 rounded-2xl font-bold mt-10 border border-red-500/20 active:scale-95 transition-all">Sign Out</button>
                    </div>
                </div>
            );
        };

        const AdminView = ({ setTab }) => {
            const [t, setT] = useState('');
            const [m, setM] = useState('');
            const send = async () => {
                if (!t || !m) return alert('هەموو خانەکان پڕبکەرەوە');
                if (!confirm('ئایا دڵنیای لە ناردنی ئەم ئاگادارییە بۆ هەمووان؟')) return;
                await db.ref('notifications').push({ title: t, message: m, timestamp: Date.now() });
                setT(''); setM(''); alert('ئاگادارییەکە نێردرا'); setTab('notif');
            };
            return (
                <div className="p-8 space-y-6">
                    <h2 className="text-2xl font-black text-red-500 uppercase italic flex items-center gap-3"><i className="fas fa-shield-halved"></i> Admin Panel</h2>
                    <div className="space-y-4">
                        <input className="w-full h-14 bg-slate-900 rounded-2xl px-6 outline-none text-white border border-white/5 focus:border-red-500/50" placeholder="ناونیشانی ئاگاداری" value={t} onChange={x=>setT(x.target.value)} />
                        <textarea className="w-full h-40 bg-slate-900 rounded-2xl px-6 py-4 outline-none text-white border border-white/5 resize-none focus:border-red-500/50" placeholder="دەقی ئاگادارییەکە لێرە بنوسە..." value={m} onChange={x=>setM(x.target.value)} />
                        <button onClick={send} className="w-full h-14 bg-red-600 rounded-2xl font-black shadow-xl shadow-red-900/20 active:scale-95 transition-all uppercase tracking-widest">SEND BROADCAST</button>
                    </div>
                </div>
            );
        };

        const CreateRoomView = ({ user, setView }) => {
            const [n, setN] = useState('');
            const [d, setD] = useState('');
            return (
                <div className="fixed inset-0 bg-slate-950 z-[150] p-10 flex flex-col">
                    <header className="flex items-center gap-4 mb-8 pt-[env(safe-area-inset-top)]">
                        <button onClick={() => setView('main')} className="w-12 h-12 rounded-full glass flex items-center justify-center"><i className="fas fa-times"></i></button>
                        <h2 className="text-3xl font-bold">ڕوومێکی نوێ</h2>
                    </header>
                    <div className="space-y-4">
                        <input className="w-full h-14 bg-slate-900 rounded-2xl px-6 outline-none text-white border border-white/5 focus:border-blue-500/50" placeholder="ناوی ڕووم" onChange={x=>setN(x.target.value)} />
                        <textarea className="w-full h-40 bg-slate-900 rounded-2xl px-6 py-4 outline-none text-white resize-none border border-white/5 focus:border-blue-500/50" placeholder="دەربارەی ڕووم بنوسە..." onChange={x=>setD(x.target.value)} />
                        <div className="p-4 glass rounded-2xl flex justify-between items-center border border-white/5">
                            <span className="text-xs text-slate-500 uppercase font-bold tracking-widest">تێچووی دروستکردن</span>
                            <span className="text-sm font-black text-yellow-500">{user?.isAdmin ? 'FREE' : ROOM_COST + ' COINS'}</span>
                        </div>
                        <button onClick={async () => {
                            if (!user?.isAdmin && (user?.coins || 0) < ROOM_COST) return alert('کۆینت پێویستە بۆ ئەم کارە');
                            const roomRef = db.ref('rooms').push();
                            await roomRef.set({
                                id: roomRef.key, name: n, description: d, 
                                ownerId: user?.uid, photoURL: `https://picsum.photos/seed/${roomRef.key}/400/300`, 
                                createdAt: firebase.database.ServerValue.TIMESTAMP
                            });
                            if (!user?.isAdmin) await db.ref(`users/${user.uid}`).update({ coins: user.coins - ROOM_COST });
                            setView('main');
                        }} className="w-full h-14 bg-blue-600 rounded-2xl font-bold shadow-lg active:scale-95 transition-all">Launch Room</button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
